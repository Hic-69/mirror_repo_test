name: Chocolatine

"on":
  push:
  pull_request:
    types: [opened]

env:
  MIRROR_SSH_URL: "git@github.com:Hic-69/mirror_repo_test.git"
  EXECUTABLES: "mysh"

jobs:
  determine_should_run:
    name: Determine whether the workflow should run
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check branch and repository
        id: check
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if [[ "$branch" == no-ga/* ]] || [[ "$MIRROR_SSH_URL" == *"${{ github.repository }}"* ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  check_compilation_and_coding_style:
    needs: determine_should_run
    if: needs.determine_should_run.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run banana-check-repo
        run: banana-check-repo . > banana-output.log 2>&1 || true
      - name: Build project
        timeout-minutes: 2
        run: make CC=epiclang
      - name: Report coding style errors as annotations
        id: coding_style
        run: |
          has_errors=0
          grep -E "^[^:]+:[0-9]+:" banana-output.log > style-errors.txt || true
          if [ -s style-errors.txt ]; then
            has_errors=1
          fi
          while IFS=: read -r file line message; do
            file=$(echo "$file" | sed 's|^\./||')
            echo "::error file=${file},line=${line}::${message}"
          done < style-errors.txt
          echo "has_errors=${has_errors}" >> "$GITHUB_OUTPUT"
      - name: Fail job if coding style errors were found
        if: steps.coding_style.outputs.has_errors == '1'
        run: exit 1
      - name: Clean build artifacts
        run: make clean
      - name: Check expected executables exist and are executable
        shell: bash
        run: |
          status=0
          IFS=',' read -ra execs <<< "$EXECUTABLES"
          for exec in "${execs[@]}"; do
            exec="$(echo "$exec" | xargs)"
            [ -z "$exec" ] && continue
            if [ ! -e "$exec" ]; then
              echo "::error file=${exec}::Expected executable '${exec}' was not produced by make"
              status=1
            elif [ ! -x "$exec" ]; then
              echo "::error file=${exec}::'${exec}' exists but is not executable"
              status=1
            fi
          done
          exit $status

  run_tests:
    needs: check_compilation_and_coding_style
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run tests
        timeout-minutes: 2
        run: make tests_run

  push_to_mirror:
    needs: run_tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_SSH_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}