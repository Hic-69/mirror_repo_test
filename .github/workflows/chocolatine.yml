name: Chocolatine

"on":
  push:
  pull_request:
    types: [opened]

env:
  MIRROR_SSH_URL: "git@github.com:EpitechPromo/mirror-repo.git"
  EXECUTABLES: "mysh"

jobs:
  check_compilation_and_coding_style:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'no-ga/') && !contains(env.MIRROR_SSH_URL, github.repository) }}
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run banana-check-repo
        run: banana-check-repo .
      - name: Build project
        timeout-minutes: 2
        env:
          CC: epiclang
        run: make
      - name: Report coding style errors as annotations
        id: coding_style
        run: |
          has_errors=0
          if [ -s coding-style-reports.log ]; then
            while IFS=',' read -r file line severity code message; do
              [ -z "$file" ] && continue
              has_errors=1
              file="${file#./}"
              echo "::error file=${file},line=${line}::[${severity}] ${code}: ${message}"
            done < coding-style-reports.log
          fi
          echo "has_errors=${has_errors}" >> "$GITHUB_OUTPUT"
      - name: Fail job if coding style errors were found
        if: steps.coding_style.outputs.has_errors == '1'
        run: exit 1
      - name: Clean build artifacts
        run: make clean
      - name: Check expected executables exist and are executable
        run: |
          status=0
          IFS=',' read -ra execs <<< "$EXECUTABLES"
          for exec in "${execs[@]}"; do
            exec="$(echo "$exec" | xargs)"
            [ -z "$exec" ] && continue
            if [ ! -e "$exec" ]; then
              echo "::error file=${exec}::Expected executable '${exec}' was not produced by make"
              status=1
            elif [ ! -x "$exec" ]; then
              echo "::error file=${exec}::'${exec}' exists but is not executable"
              status=1
            fi
          done
          exit $status